name: Deploy Gamer Central Theme via FTP

on:
  push:
    branches: [ "main" ]

jobs:
  web-deploy:
    name: Run Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: if0_43338697
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /htdocs/wp-content/themes/gamer-central/
